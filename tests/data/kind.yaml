# Config for the kind integration test (scripts/kind-e2e.sh): small, but each scene takes a few
# seconds so a pod can be deleted between scenes; one scene per Blender process for fine resume.
version: 1
scenario: tabletop
image: { width: 320, height: 240 }
render: { samples: 16, denoise: false, threads: 1, batch_size: 1 }
objects:
  library:
    - { name: box,  source: primitive:box,      category: box,      size_m: [0.06, 0.10] }
    - { name: can,  source: primitive:cylinder, category: cylinder, size_m: [0.06, 0.10] }
    - { name: ring, source: primitive:torus,    category: torus,    size_m: [0.06, 0.10] }
  count: [3, 6]
support: { kind: [table, bin], size_m: { x: [0.5, 0.6], y: [0.4, 0.5] } }
camera: { distance_m: [0.7, 0.9], elevation_deg: [50, 70] }
