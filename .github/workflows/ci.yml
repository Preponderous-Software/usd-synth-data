name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BLENDER_VERSION: "5.2.2"
  BLENDER_SHA256: "84098912789dc450e95697c4184fb8a90acbe5111c2ba4aede3fecb57806a168"
  # Strata release .so (render.engine: strata), checked against the release's SHA256SUMS
  STRATA_VERSION: "0.5.0"
  STRATA_SHA256: "44f8263426b546c04295b1033032fded97541060c8e804873894d43e80fcffcb"

jobs:
  test:
    name: lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Pytest
        run: pytest

  render:
    name: render tests (Blender)
    runs-on: ubuntu-24.04
    env:
      USD_SYNTH_BLENDER: ${{ github.workspace }}/.blender/blender
      USD_SYNTH_REQUIRE_BLENDER: "1"
      USD_SYNTH_TEST_THREADS: "4"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache Blender
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: .blender-dl
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64
      - name: Download Blender
        if: steps.blender-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .blender-dl
          curl -fsSL -o .blender-dl/blender.tar.xz \
            "https://download.blender.org/release/Blender${BLENDER_VERSION%.*}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
      - name: Install Blender
        run: |
          echo "${BLENDER_SHA256}  .blender-dl/blender.tar.xz" | sha256sum -c -
          mkdir -p .blender
          tar -xJf .blender-dl/blender.tar.xz -C .blender --strip-components=1
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libxkbcommon0 libxi6 libxrender1 libxfixes3 libsm6 libgl1 libegl1
          "$USD_SYNTH_BLENDER" --version | head -1
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Pytest (Blender required)
        run: pytest -m blender -v --durations=10

  strata:
    name: render tests (Strata)
    runs-on: ubuntu-24.04
    env:
      USD_SYNTH_STRATA: ${{ github.workspace }}/.strata/libstrata.so
      USD_SYNTH_REQUIRE_STRATA: "1"
      USD_SYNTH_TEST_THREADS: "4"
      LIBGL_ALWAYS_SOFTWARE: "1"
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Strata and Mesa llvmpipe (EGL surfaceless, no X server)
        run: |
          mkdir -p .strata
          curl -fsSL -o .strata/libstrata.so \
            "https://github.com/Preponderous-Software/strata/releases/download/v${STRATA_VERSION}/libstrata-${STRATA_VERSION}-linux-x64.so"
          echo "${STRATA_SHA256}  .strata/libstrata.so" | sha256sum -c -
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1-mesa-dri
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Pytest (Strata required)
        run: pytest -m strata -v --durations=10

  image:
    name: render worker image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build -t usd-synth:ci .
      - name: Render a bundled-config scene at 640x480 inside the container
        run: |
          docker run --rm --entrypoint sh usd-synth:ci -c '
            set -e
            usd-synth scenes --config configs/tabletop.yaml --seed 42 --count 1 --out /tmp/s
            usd-synth render --config configs/tabletop.yaml --scenes /tmp/s --out /tmp/r
            python - <<PY
          from PIL import Image
          from usd_synth.passes import read_passes
          rgb = Image.open("/tmp/r/scene_000000/rgb.png")
          p = read_passes("/tmp/r/scene_000000/aux.exr")
          assert rgb.size == (640, 480), rgb.size
          assert p.depth.shape == p.index.shape == (480, 640)
          print("container render OK:", rgb.size, "instance ids", sorted(set(p.index.ravel().tolist())))
          PY
            sed "s/engine: cycles/engine: strata/" configs/tabletop.yaml > /tmp/strata.yaml
            usd-synth render --config /tmp/strata.yaml --scenes /tmp/s --out /tmp/rs
            python - <<PY
          from PIL import Image
          from usd_synth.passes import read_passes
          a = read_passes("/tmp/r/scene_000000/aux.exr").index
          b = read_passes("/tmp/rs/scene_000000/aux.exr").index
          assert Image.open("/tmp/rs/scene_000000/rgb.png").size == (640, 480)
          print("container Strata render OK; label maps agree on", f"{(a == b).mean():.5f}", "of pixels")
          assert (a == b).mean() > 0.999
          PY
          '

  s3-sink:
    name: storage tests (MinIO)
    runs-on: ubuntu-24.04
    env:
      MINIO_TAG: RELEASE.2025-10-15T17-29-55Z
      MINIO_COMMIT: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Cache MinIO build
        id: minio-cache
        uses: actions/cache@v4
        with:
          path: .minio-bin
          key: minio-${{ env.MINIO_COMMIT }}
      - uses: actions/setup-go@v5
        if: steps.minio-cache.outputs.cache-hit != 'true'
        with:
          go-version: "1.24.8"
          cache: false
      - name: Build MinIO from its final release tag
        if: steps.minio-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 --branch "$MINIO_TAG" https://github.com/minio/minio.git /tmp/minio-src
          test "$(git -C /tmp/minio-src rev-parse HEAD)" = "$MINIO_COMMIT"
          (cd /tmp/minio-src && CGO_ENABLED=0 go build -trimpath -o "$GITHUB_WORKSPACE/.minio-bin/minio" .)
      - name: Start MinIO
        run: |
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=usd-synth-test MINIO_ROOT_PASSWORD=usd-synth-test-secret \
            nohup .minio-bin/minio server /tmp/minio-data --address 127.0.0.1:9000 > /tmp/minio.log 2>&1 &
          for i in $(seq 60); do curl -sf http://127.0.0.1:9000/minio/health/ready && break; sleep 1; done
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Resume/merge contract on both sinks
        env:
          USD_SYNTH_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: usd-synth-test
          AWS_SECRET_ACCESS_KEY: usd-synth-test-secret
          USD_SYNTH_REQUIRE_S3: "1"
        run: pytest tests/test_storage_merge.py -v

  kind:
    name: kind e2e (Indexed Job + MinIO)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KIND_VERSION: v0.33.0
      KIND_SHA256: aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install kind
        run: |
          curl -fsSL -o /tmp/kind "https://github.com/kubernetes-sigs/kind/releases/download/${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  /tmp/kind" | sha256sum -c -
          sudo install /tmp/kind /usr/local/bin/kind
          kind version
          kubectl version --client
      - name: Install
        run: python -m pip install -e .
      - name: Run scripts/kind-e2e.sh
        run: scripts/kind-e2e.sh
