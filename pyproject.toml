[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "usd-synth-data"
version = "0.1.0"
description = "Procedural synthetic-dataset generator: randomized OpenUSD scenes rendered headless with Blender Cycles into COCO-style datasets."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Daniel McCoy Stephenson" }]
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "OpenEXR==3.5.2",
    "Pillow==13.0.0",
    "pycocotools==2.0.11",
    "pydantic==2.14.1",
    "PyYAML==6.0.3",
    "usd-core==26.8",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]

[project.scripts]
usd-synth = "usd_synth.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/usd_synth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # pycocotools 2.0.11 decode() predates NumPy 2's __array__ copy keyword; harmless here
    "ignore:__array__ implementation doesn't accept a copy keyword:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
