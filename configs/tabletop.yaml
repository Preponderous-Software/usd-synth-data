# Bundled tabletop / bin-picking scenario. Every [min, max] pair is sampled uniformly.
# Schema: ARCHITECTURE.md, "Randomization config schema".
version: 1
scenario: tabletop
image: { width: 640, height: 480 }
render:
  engine: cycles
  device: cpu            # cpu | gpu
  samples: 64
  denoise: true
  threads: 0             # 0 = let Blender decide
  batch_size: 8          # scenes rendered per Blender process
objects:
  library:
    - { name: box,     source: primitive:box,      category: box,      size_m: [0.04, 0.12] }
    - { name: can,     source: primitive:cylinder, category: cylinder, size_m: [0.05, 0.10] }
    - { name: ball,    source: primitive:sphere,   category: sphere,   size_m: [0.04, 0.09] }
    - { name: capsule, source: primitive:capsule,  category: capsule,  size_m: [0.05, 0.12] }
    - { name: ring,    source: primitive:torus,    category: torus,    size_m: [0.05, 0.10] }
  count: [3, 12]
  placement:
    region: support
    min_separation_m: 0.005
    yaw_deg: [0, 360]
    allow_tipped: 0.2
distractors: { count: [0, 8], label: ignore, size_m: [0.02, 0.06] }
support:
  kind: [table, bin]
  size_m: { x: [0.6, 1.2], y: [0.4, 0.8] }
materials:
  base_color: { h: [0, 1], s: [0.0, 0.9], v: [0.1, 1.0] }
  roughness: [0.1, 0.9]
  metallic: { choice: [0.0, 1.0], p: [0.85, 0.15] }
  textures: []
lighting:
  key_lights: [1, 3]
  intensity: [30, 300]      # USD inputs:intensity; Blender 5.2 imports as a point light of intensity x pi W
  color_temp_k: [2700, 6500]
  dome: { enabled: true, intensity: [0.1, 1.0], hdris: [] }
camera:
  look_at: support_center
  distance_m: [0.6, 1.5]
  elevation_deg: [25, 80]
  azimuth_deg: [0, 360]
  focal_length_mm: [24, 50]
  sensor_width_mm: 36
  jitter_target_m: 0.05
labels:
  min_visible_pixels: 50
  min_visible_fraction: 0.1
  depth: { format: png16_mm, max_m: 10.0, keep_exr: false }
